name: Deploy development
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fabric-app-development
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: fabric-development
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      FABRIC_WORKSPACE_NAME: ${{ vars.FABRIC_WORKSPACE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Login
        run: npx rayfin login --service-principal -t "$TENANT_ID" -u "$CLIENT_ID" -p "$CLIENT_SECRET"
      - name: Dry run
        run: npx rayfin up --workspace "$FABRIC_WORKSPACE_NAME" --dry-run --verbose
      - name: Deploy
        run: npx rayfin up --workspace "$FABRIC_WORKSPACE_NAME" --yes
